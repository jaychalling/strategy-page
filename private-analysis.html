<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private 전략 백테스트 분석</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a1f2e;
    --text: #e4e6eb;
    --muted: #8a8f98;
    --accent: #4fd1c5;
    --pos: #10b981;
    --neg: #ef4444;
    --border: #2a2f3e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  h1, h2, h3 { margin: 0 0 12px 0; }
  .container { max-width: 1400px; margin: 0 auto; }
  .section { background: var(--panel); border: 1px solid var(--border);
              border-radius: 8px; padding: 24px; margin-bottom: 24px; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .kpi { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .value { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .kpi .delta { font-size: 13px; margin-top: 2px; }
  .delta.pos, .pos { color: var(--pos); }
  .delta.neg, .neg { color: var(--neg); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .variant-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .variant-card.accepted { border-color: var(--pos); }
  .variant-card.rejected { opacity: 0.6; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px;
           background: var(--border); color: var(--muted); }
  .badge.parameter { background: #3b4b6b; color: #9cb3d9; }
  .badge.filter    { background: #4b3b6b; color: #b39cd9; }
  .badge.structure { background: #6b4b3b; color: #d9b39c; }
  .heatmap { display: grid; gap: 2px; margin-top: 12px; }
  .heatmap-cell { padding: 8px; text-align: center; font-size: 11px; border-radius: 2px; }
  .variant-detail-list { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .variant-detail { background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--pos); border-radius: 6px; padding: 16px; }
  .variant-detail-header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .variant-detail-id { font-weight: 700; color: var(--accent); font-size: 14px; background: rgba(79, 209, 197, 0.1); padding: 2px 8px; border-radius: 4px; }
  .variant-detail-delta { margin-left: auto; font-size: 12px; }
  .variant-detail-row { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 6px 0; font-size: 13px; line-height: 1.6; }
  .variant-detail-row.caution { color: #f0b050; }
  .variant-detail-row.evidence { border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 10px; }
  .variant-detail-label { color: var(--muted); font-size: 11px; font-weight: 500; padding-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
  .evidence-list { background: rgba(79, 209, 197, 0.04); border-left: 2px solid var(--accent); border-radius: 3px; padding: 10px 14px; font-size: 12px; line-height: 1.75; }
  .evidence-line { margin-bottom: 3px; font-family: "SF Mono", "Consolas", "Monaco", "Courier New", monospace; color: #c8cdd4; }
  .evidence-line:last-child { margin-bottom: 0; }
  .evidence-line b { color: var(--text); background: rgba(79, 209, 197, 0.15); padding: 1px 4px; border-radius: 2px; font-weight: 600; }
  .recommendation-highlight { background: linear-gradient(135deg, rgba(79, 209, 197, 0.12), rgba(16, 185, 129, 0.08)); border: 2px solid var(--accent); border-radius: 10px; padding: 20px 24px; margin-bottom: 16px; }
  .rec-title { font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
  .rec-body p { margin: 8px 0; line-height: 1.6; }
  .rec-body table { background: rgba(0, 0, 0, 0.2); border-radius: 6px; overflow: hidden; }
  .rec-body table th { background: rgba(79, 209, 197, 0.1); color: var(--accent); }
  @media (max-width: 640px) {
    .variant-detail-header { font-size: 13px; }
    .variant-detail-delta { margin-left: 0; width: 100%; }
    .variant-detail-row { grid-template-columns: 1fr; gap: 2px; }
  }
  button { background: var(--border); color: var(--text); border: 1px solid var(--muted);
            padding: 6px 12px; border-radius: 4px; margin-right: 6px; cursor: pointer; }
  button:hover { background: var(--muted); color: var(--bg); }
  canvas { max-width: 100%; }
  @media (max-width: 768px) {
    .card-grid { grid-template-columns: 1fr; }
    table { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Private 전략 백테스트 분석</h1>
  <p id="meta-line" style="color: var(--muted)">로딩 중...</p>

  <section class="section" id="summary">
    <h2>요약</h2>
    <div class="summary-grid" id="summary-grid"></div>
  </section>

  <section class="section" id="baseline-diagnostic">
    <h2>베이스라인 진단</h2>
    <div id="baseline-body">로딩 중...</div>
  </section>

  <section class="section" id="variant-catalog">
    <h2>가설 카탈로그</h2>
    <div style="margin-bottom: 12px">
      <button data-filter="all">전체</button>
      <button data-filter="parameter">파라미터</button>
      <button data-filter="filter">필터</button>
      <button data-filter="structure">구조</button>
    </div>
    <div class="card-grid" id="variant-cards">로딩 중...</div>
  </section>

  <section class="section" id="final">
    <h2>최종 추천안</h2>
    <div id="final-body">로딩 중...</div>
  </section>

  <section class="section" id="robustness">
    <h2>견고성 체크</h2>
    <div id="robustness-body">로딩 중...</div>
  </section>
</div>

<script>
const STATE = { baseline: null, variants: null };

async function loadData() {
  const [baseline, variants] = await Promise.all([
    fetch('data/private_sim/baseline.json').then(r => r.json()),
    fetch('data/private_sim/variants.json').then(r => r.json()),
  ]);
  STATE.baseline = baseline;
  STATE.variants = variants;
  render();
}

function fmt(v, digits = 2) {
  if (v === null || v === undefined) return '-';
  return v.toFixed(digits);
}

function render() {
  renderMeta();
  renderSummary();
  renderBaselineDiagnostic();
  renderVariantCatalog();
  renderFinal();
  renderRobustness();
}

function renderMeta() {
  const m = STATE.baseline.meta;
  document.getElementById('meta-line').textContent =
    `${m.start_date} ~ ${m.end_date} · ${m.n_days}거래일 · 신호 ${m.n_signals_dedup}건 · ${new Date(m.generated_at).toLocaleString('ko-KR')} 생성`;
}

function renderSummary() {
  const b = STATE.baseline.overall;
  const f = STATE.variants.final ? STATE.variants.final.result : null;
  const kpis = [
    { label: '거래 수', base: b.n_trades, final: f?.n_trades, fmt: v => v },
    { label: '승률', base: b.winrate * 100, final: f ? f.winrate * 100 : null, suffix: '%' },
    { label: '기대값', base: b.expectancy, final: f?.expectancy, suffix: '%' },
    { label: '총 PnL', base: b.total_pnl_pct, final: f?.total_pnl_pct, suffix: '%' },
    { label: 'MDD', base: b.mdd_pct, final: f?.mdd_pct, suffix: '%' },
    { label: '최대 연속손실', base: b.max_consec_loss, final: f?.max_consec_loss, fmt: v => v },
  ];
  const grid = document.getElementById('summary-grid');
  grid.innerHTML = kpis.map(k => {
    const delta = (k.final !== null && k.final !== undefined) ? (k.final - k.base) : null;
    const deltaCls = delta === null ? '' : (delta > 0 ? 'pos' : 'neg');
    const deltaStr = delta === null ? '' :
      `<div class="delta ${deltaCls}">${delta > 0 ? '+' : ''}${fmt(delta)}${k.suffix || ''}</div>`;
    const baseStr = k.fmt ? k.fmt(k.base) : `${fmt(k.base)}${k.suffix || ''}`;
    return `
      <div class="kpi">
        <div class="label">${k.label}</div>
        <div class="value">${baseStr}</div>
        ${deltaStr}
      </div>
    `;
  }).join('');
}

function renderBaselineDiagnostic() {
  const b = STATE.baseline;
  const body = document.getElementById('baseline-body');
  body.innerHTML = `
    <h3>일별 Equity Curve</h3>
    <canvas id="equityChart" height="80"></canvas>

    <h3 style="margin-top:24px">조건별 분해</h3>
    <table id="conditionTable"><thead><tr>
      <th>조건</th><th>거래</th><th>승률</th><th>기대값</th><th>평균수익</th><th>평균손실</th><th>총PnL</th>
    </tr></thead><tbody></tbody></table>

    <h3 style="margin-top:24px">진입 시간대별 기대값</h3>
    <canvas id="entryTimeChart" height="80"></canvas>

    <h3 style="margin-top:24px">딥 하락폭 분해</h3>
    <canvas id="dipDepthChart" height="80"></canvas>

    <h3 style="margin-top:24px">Exit 유형</h3>
    <table id="exitTable"><thead><tr>
      <th>유형</th><th>거래</th><th>승률</th><th>기대값</th>
    </tr></thead><tbody></tbody></table>

    <h3 style="margin-top:24px">교차 히트맵: 조건 × 진입시간대</h3>
    <div id="heatmap"></div>
  `;

  // Equity curve
  const ec = b.equity_curve;
  new Chart(document.getElementById('equityChart'), {
    type: 'line',
    data: {
      labels: ec.map(r => r.date),
      datasets: [{
        label: '누적 PnL (%)',
        data: ec.map(r => r.cum_pnl),
        borderColor: '#4fd1c5',
        backgroundColor: 'rgba(79, 209, 197, 0.1)',
        tension: 0.2,
        fill: true,
      }]
    },
    options: { plugins: { legend: { display: false } }, responsive: true }
  });

  // Condition table
  const condBody = document.querySelector('#conditionTable tbody');
  condBody.innerHTML = Object.entries(b.buckets.condition).map(([k, v]) => `
    <tr>
      <td>${k}</td>
      <td>${v.n_trades}</td>
      <td>${fmt(v.winrate * 100)}%</td>
      <td>${fmt(v.expectancy)}%</td>
      <td>${fmt(v.avg_win)}%</td>
      <td>${fmt(v.avg_loss)}%</td>
      <td class="${v.total_pnl_pct >= 0 ? 'pos' : 'neg'}">${fmt(v.total_pnl_pct)}%</td>
    </tr>
  `).join('');

  // Entry time bar
  const et = b.buckets.entry_time;
  const etLabels = Object.keys(et);
  new Chart(document.getElementById('entryTimeChart'), {
    type: 'bar',
    data: {
      labels: etLabels,
      datasets: [{
        label: '기대값 (%)',
        data: etLabels.map(k => et[k].expectancy),
        backgroundColor: etLabels.map(k => et[k].expectancy >= 0 ? '#10b981' : '#ef4444'),
      }]
    },
    options: { plugins: { legend: { display: false } } }
  });

  // Dip depth bar
  const dd = b.buckets.dip_depth;
  const ddLabels = Object.keys(dd);
  new Chart(document.getElementById('dipDepthChart'), {
    type: 'bar',
    data: {
      labels: ddLabels,
      datasets: [{
        label: '총 PnL (%)',
        data: ddLabels.map(k => dd[k].total_pnl_pct),
        backgroundColor: ddLabels.map(k => dd[k].total_pnl_pct >= 0 ? '#10b981' : '#ef4444'),
      }]
    }
  });

  // Exit table
  const exitBody = document.querySelector('#exitTable tbody');
  exitBody.innerHTML = Object.entries(b.buckets.exit_type).map(([k, v]) => `
    <tr>
      <td>${k}</td>
      <td>${v.n_trades}</td>
      <td>${fmt(v.winrate * 100)}%</td>
      <td class="${v.expectancy >= 0 ? 'pos' : 'neg'}">${fmt(v.expectancy)}%</td>
    </tr>
  `).join('');

  // Heatmap
  renderHeatmap('heatmap', b.cross.condition_x_entry_time);
}

function renderHeatmap(containerId, crossData) {
  const { rows, cols, cells } = crossData;
  const el = document.getElementById(containerId);
  // 최대 절대값으로 정규화
  let maxAbs = 0.01;
  cells.forEach(row => row.forEach(c => {
    if (Math.abs(c.expectancy) > maxAbs) maxAbs = Math.abs(c.expectancy);
  }));

  const colWidths = `150px repeat(${cols.length}, 1fr)`;
  let html = `<div class="heatmap" style="grid-template-columns: ${colWidths}">`;
  html += `<div></div>`;
  cols.forEach(c => html += `<div style="text-align:center;font-size:11px;color:var(--muted)">${c}</div>`);
  rows.forEach((r, ri) => {
    html += `<div style="padding:8px;font-size:12px">${r}</div>`;
    cells[ri].forEach(cell => {
      const ratio = cell.expectancy / maxAbs;
      const color = ratio >= 0
        ? `rgba(16, 185, 129, ${Math.min(1, Math.abs(ratio))})`
        : `rgba(239, 68, 68, ${Math.min(1, Math.abs(ratio))})`;
      html += `<div class="heatmap-cell" style="background:${color}" title="${cell.n_trades}건">
                 ${cell.n_trades > 0 ? fmt(cell.expectancy, 2) + '%' : '-'}
               </div>`;
    });
  });
  html += `</div>`;
  el.innerHTML = html;
}

    why: "11~12시 구간에 잡히는 신호는 이미 장초반 모멘텀이 소진된 후라 진입 후 상승 여력이 낮음. 11시 이후 신호를 차단하면 평균 거래 품질이 올라가고 슬롯을 헛되이 소모하는 일이 줄어듦.",

    caution: "세력감지는 11:00+ 구간에서 오히려 좋음(3건 +5.35%). 하지만 S1a와 함께 사용하므로 무관.",
    evidence: [

      "<b>굿모닝 8건: 합 -7.83% · 승률 38% · 평균 -0.98%/거래</b> — 명백한 손실 구간",
      "<b>골든10분 2건: 합 -3.92% · 승률 50% · 평균 -1.96%/거래</b> — 샘플 적지만 음수",
      "세력감지 3건: 합 +5.35% · 승률 100% · 평균 +1.78%/거래 — 이 세 건은 포기하는 비용",
      "Net: -7.83 -3.92 +5.35 = <b>-6.40%</b> 제거 → 베이스라인 대비 +6.40% 개선",

      "• 굿모닝 1건: <b>-3.43% (손절)</b>",

  },

function renderVariantCatalog() {
  const variants = STATE.variants.variants;
  const container = document.getElementById('variant-cards');
  let currentFilter = 'all';

  function draw() {
    const filtered = currentFilter === 'all'
      ? variants
      : variants.filter(v => v.category === currentFilter);
    const sorted = [...filtered].sort(
      (a, b) => b.result.delta_pnl - a.result.delta_pnl
    );
    container.innerHTML = sorted.map(v => {
      const r = v.result;
      return `
        <div class="variant-card ${v.status}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <strong>${v.id}: ${v.title}</strong>
            <span class="badge ${v.category}">${v.category}</span>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:12px">${v.description}</div>
          <div style="font-size:13px">
            <div>Δ PnL: <span class="${r.delta_pnl >= 0 ? 'pos' : 'neg'}">${r.delta_pnl >= 0 ? '+' : ''}${fmt(r.delta_pnl)}%</span></div>
            <div>Δ 승률: <span class="${r.delta_winrate >= 0 ? 'pos' : 'neg'}">${r.delta_winrate >= 0 ? '+' : ''}${fmt(r.delta_winrate * 100)}%p</span></div>
            <div>Δ MDD: <span class="${r.delta_mdd >= 0 ? 'pos' : 'neg'}">${r.delta_mdd >= 0 ? '+' : ''}${fmt(r.delta_mdd)}%</span></div>
            <div style="margin-top:8px">거래 ${r.n_trades} · 상태 <strong>${v.status === 'accepted' ? '✅ 채택' : '❌ 기각'}</strong></div>
          </div>
        </div>
      `;
    }).join('');
  }

  document.querySelectorAll('[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      draw();
    });
  });

  draw();
}

      <div>
        <h4>베이스라인</h4>
        <table><tbody>${r.worst5_baseline.map(d => `<tr><td>${d.date}</td><td class="neg">${fmt(d.pnl)}%</td></tr>`).join('')}</tbody></table>
      </div>
      <div>
        <h4>최종</h4>
        <table><tbody>${r.worst5_final.map(d => `<tr><td>${d.date}</td><td class="neg">${fmt(d.pnl)}%</td></tr>`).join('')}</tbody></table>
      </div>
    </div>

    <h3 style="margin-top:24px">R3: 연속손실 분포</h3>
    <table>
      <thead><tr><th>연속손실 길이</th><th>베이스라인</th><th>최종</th></tr></thead>
      <tbody id="consecBody"></tbody>
    </table>
  `;
  const allLens = new Set([
    ...Object.keys(r.consec_loss_baseline || {}),
    ...Object.keys(r.consec_loss_final || {}),
  ]);
  const consecBody = document.getElementById('consecBody');
  consecBody.innerHTML = [...allLens].sort((a,b) => +a - +b).map(len => `
    <tr>
      <td>${len}연속</td>
      <td>${(r.consec_loss_baseline || {})[len] || 0}회</td>
      <td>${(r.consec_loss_final || {})[len] || 0}회</td>
    </tr>
  `).join('');
}

loadData().catch(err => {
  document.getElementById('meta-line').textContent = '데이터 로드 실패: ' + err.message;
  console.error(err);
});
</script>
</body>
</html>
